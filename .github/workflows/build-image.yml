# Reusable build → test → scan → publish pipeline for dementev/* Docker Hub images.
# Callers pass image name, tag spec, and push=true/false; see README.md.
#
# Policy: every action is pinned to a full commit SHA (see the 2026-03 trivy-action
# tag-hijack, GHSA-69fq-xp46-6x23). Bump pins by editing the SHA and the version comment.
name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: "Docker Hub repository name without namespace (e.g. angie)"
        required: true
        type: string
      tags:
        description: "docker/metadata-action tags spec"
        required: true
        type: string
      push:
        description: "Publish to Docker Hub (false = build, test and scan only)"
        required: true
        type: boolean
      labels:
        description: "docker/metadata-action labels spec"
        required: false
        type: string
        default: ""
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: .
      platforms:
        required: false
        type: string
        default: linux/amd64,linux/arm64
      build-args:
        required: false
        type: string
        default: ""
      test-command:
        description: "Shell command run against the locally built image, available as $IMAGE"
        required: false
        type: string
        default: ""
      cache-scope:
        description: "GHA cache scope; set per matrix entry when one repo builds several variants"
        required: false
        type: string
        default: ""
      trivy-severity:
        required: false
        type: string
        default: CRITICAL,HIGH
      trivy-ignore-unfixed:
        required: false
        type: boolean
        default: true
      cosign:
        description: "Keyless-sign the pushed digest"
        required: false
        type: boolean
        default: true
      timeout-minutes:
        required: false
        type: number
        default: 60
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write # cosign keyless OIDC
    env:
      IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image }}
      TEST_IMAGE: localbuild/${{ inputs.image }}:ci
      CACHE_FROM: type=gha${{ inputs.cache-scope != '' && format(',scope={0}', inputs.cache-scope) || '' }}
      CACHE_TO: type=gha,mode=max${{ inputs.cache-scope != '' && format(',scope={0}', inputs.cache-scope) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.labels }}

      - name: Build for test and scan (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ env.TEST_IMAGE }}
          build-args: ${{ inputs.build-args }}
          cache-from: ${{ env.CACHE_FROM }}
          cache-to: ${{ env.CACHE_TO }}

      - name: Test
        if: inputs.test-command != ''
        env:
          IMAGE: localbuild/${{ inputs.image }}:ci
        run: ${{ inputs.test-command }}

      # A .trivyignore file in the caller repo root is honored automatically.
      - name: Trivy vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: table
          exit-code: "1"
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}

      - name: Build and push
        id: push
        if: inputs.push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: ${{ env.CACHE_FROM }}
          cache-to: ${{ env.CACHE_TO }}

      - name: Install Cosign
        if: inputs.push && inputs.cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        if: inputs.push && inputs.cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done
